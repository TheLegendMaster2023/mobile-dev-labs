name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Lab 1 and Lab 3 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Lab 1 (Hello Compose)
        working-directory: lab1-hello-compose
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Lab1-HelloCompose.apk

      - name: Build Lab 3 (Profile Compose)
        working-directory: lab3-profile-compose
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Lab3-ProfileApp.apk

      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Labs-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Лабораторные работы 1 и 3 (APK)"
          body: |
            ## Сборка Android APK для лабораторных работ №1 и №3
            **Студент:** Мухамеджанов Эльёр Тимурович (ПИН-б-о-24-1)
            **Дисциплина:** Программирование мобильных устройств

            ### Установочные файлы:
            - **`Lab1-HelloCompose.apk`** — Лабораторная работа №1 (Первое приложение на Jetpack Compose)
            - **`Lab3-ProfileApp.apk`** — Лабораторная работа №3 (Экран профиля на Jetpack Compose)

            Скачайте нужный `.apk` файл прямо на Android-смартфон и установите!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
